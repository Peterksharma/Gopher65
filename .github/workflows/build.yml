name: Build

permissions:
  contents: read

on:
  push:
    branches: ["main", "gopher65"]
    tags:
      - "v*"
  pull_request:
    branches: ["main", "gopher65"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RA_HARDCORE: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
  # This fork brokers netplay through its own embedded/host signaling
  # (`--netplay-host`), never the upstream lobby, so no NETPLAY_ID secret is
  # needed — a constant keeps build.rs happy.
  NETPLAY_ID: dev
  BUILD_PROFILE: ${{ github.ref_type == 'tag' && 'release' || 'dev' }}
  BUILD_DIR: ${{ github.ref_type == 'tag' && 'release' || 'debug' }}

jobs:
  build-windows:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            arch: windows-x86_64
            llvm: win64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: windows-aarch64
            llvm: woa64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""
          cache: ${{ github.ref_type != 'tag' }}
      - name: Set LLVM_VERSION
        run: |
          $llvm_version = rustc --version --verbose | Select-String "LLVM version" | ForEach-Object { $_.Line.Split(":")[1].Trim() }
          echo "LLVM_VERSION=$llvm_version" >> $env:GITHUB_ENV
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}
          force-url:
            https://github.com/llvm/llvm-project/releases/download/llvmorg-${{
            env.LLVM_VERSION }}/LLVM-${{ env.LLVM_VERSION }}-${{ matrix.llvm
            }}.exe
      - name: Build
        run: |
          cargo build --profile ${{ env.BUILD_PROFILE }} -v --target=${{ matrix.target }}
          mkdir output
          cp target/${{ matrix.target }}/${{ env.BUILD_DIR }}/gopher64.exe output/gopher65-${{ matrix.arch }}.exe
        env:
          CC: clang-cl
          CXX: clang-cl
      # NOTE: unsigned. Windows SmartScreen will warn on first run
      # ("More info" -> "Run anyway"). No code-signing certificate is used.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gopher65-${{ matrix.arch }}
          path: output/gopher65-${{ matrix.arch }}.exe
          archive: false

  build-macos:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: macos-aarch64
            llvm: ARM64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""
          cache: ${{ github.ref_type != 'tag' }}
      - name: Set LLVM_VERSION
        run:
          echo "LLVM_VERSION=$(rustc --version --verbose | grep "LLVM version" | cut
          -d':' -f2 | xargs)" >> $GITHUB_ENV
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}
          force-url:
            https://github.com/llvm/llvm-project/releases/download/llvmorg-${{
            env.LLVM_VERSION }}/LLVM-${{ env.LLVM_VERSION }}-macOS-${{
            matrix.llvm }}.tar.xz
      - name: Build
        run: |
          cargo install cargo-bundle
          # MoltenVK (Vulkan-on-Metal) and libusb (Switch 2 controller) are
          # bundled into the .app via osx_frameworks in Cargo.toml.
          brew install molten-vk libusb
          cargo build --profile ${{ env.BUILD_PROFILE }} --no-default-features -v --target=${{ matrix.target }}
          mv target/${{ matrix.target }}/${{ env.BUILD_DIR }}/gopher64 target/${{ matrix.target }}/${{ env.BUILD_DIR }}/gopher64-cli
          cargo bundle --profile ${{ env.BUILD_PROFILE }} --target=${{ matrix.target }} --format osx
          cp target/${{ matrix.target }}/${{ env.BUILD_DIR }}/gopher64-cli target/${{ matrix.target }}/${{ env.BUILD_DIR }}/bundle/osx/Gopher65.app/Contents/MacOS/gopher64-cli
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
      # Ad-hoc signature with library validation disabled (entitlements_dev),
      # so the bundled libusb/MoltenVK load. Not notarized: on first launch
      # users right-click the app -> Open (or `xattr -cr Gopher65.app`).
      - name: Sign bundle (ad-hoc)
        run: |
          APP=target/${{ matrix.target }}/${{ env.BUILD_DIR }}/bundle/osx/Gopher65.app
          codesign -f --entitlements data/macos/entitlements_dev.plist --deep --timestamp --options runtime -s - "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" gopher65-${{ matrix.arch }}.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gopher65-${{ matrix.arch }}
          path: gopher65-${{ matrix.arch }}.zip
          archive: false

  collect-artifacts:
    name: Collect release artifacts
    needs: [build-windows, build-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v8
        with:
          skip-decompress: true
          merge-multiple: true
          path: release-artifacts
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: release-artifacts/*
