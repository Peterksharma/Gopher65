[package]
name = "gopher64"
version = "1.1.34"
edition = "2024"
rust-version = "1.97.1"

[features]
default = ["gui"]
gui = ["dep:rfd", "dep:slint", "dep:open", "dep:slint-build"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zip = "8.0"
sevenz-rust2 = "0.21"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-big-array = "0.5"
sha2 = "0.11"
tokio = {version = "1.46", features = ["rt-multi-thread", "fs", "process"] }
spin_sleep = "1.3"
encoding_rs = "0.8"
mimalloc = "0.1"
regex = "1.11"
tokio-tungstenite = { version = "0.30", features = ["native-tls-vendored"] }
matchbox_socket = "0.14"
# Embedded signaling server for `--netplay-host` (see src/signaling.rs). Same
# 0.14 line as matchbox_socket so client/server wire protocols match.
matchbox_signaling = "0.14"
matchbox_protocol = { version = "0.14", features = ["json"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
ggrs = { version = "0.13", features = ["sync-send"] }
rustc-hash = "2.1"
futures = "0.3"
rand = { version = "0.10", features = ["serde"] }
fatfs = "0.3"
semver = "1.0"
postcard = { version = "1.1", features = ["use-std"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls-vendored", "charset", "http2", "system-proxy", "json", "query"] }
discord-rich-presence = "1.1"
quick-xml = "0.41"
obfstr = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.16", default-features = false, features = ["compat-1-2", "std", "unstable-winit-030", "backend-winit", "renderer-femtovg-wgpu", "accessibility"], optional = true }
rfd = {version = "0.17", optional = true }
dirs = "6.0"
open = { version = "5.3", optional = true }
sdl3-sys = { version = "0.6", features = ["build-from-source-static"] }
sdl3-ttf-sys = { version = "0.6", features = ["build-static-vendored", "no-sdlttf-harfbuzz", "no-sdlttf-plutosvg"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.16", default-features = false, features = ["compat-1-2", "std", "backend-android-activity-06", "accessibility"], optional = true }
jni = "0.22"
sdl3-sys = { version = "0.6", features = ["build-from-source"] }
sdl3-ttf-sys = { version = "0.6", features = ["build-from-source", "no-sdlttf-harfbuzz", "no-sdlttf-plutosvg"] }

[build-dependencies]
winresource = "0.1"
bindgen = "0.72"
sdl3-src = "3.4"
slint-build = { version = "1.12", optional = true }
cc = { version = "1.2", features = ["parallel"] }

# Gopher65: build SDL from our patched source so the Switch 2 Pro Controller
# works on macOS (upstream SDL's Switch2 driver is libusb-only and cannot claim
# the HID interface the macOS kernel holds). Same version (3.4.14) as upstream —
# only src/hidapi/SDL_hidapi.c, src/joystick/hidapi/SDL_hidapi_switch2.c and
# src/misc/SDL_libusb.c are patched. See third_party/sdl3-src-patched.
[patch.crates-io]
sdl3-src = { path = "third_party/sdl3-src-patched" }

[profile.release]
lto = "thin"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[package.metadata.bundle]
name = "Gopher64"
identifier = "io.github.gopher64.gopher64"
category = "public.app-category.games"
icon = ["data/icon/gopher64_128x128.png","data/icon/gopher64_256x256.png","data/icon/gopher64_512x512.png"]
osx_frameworks = ["/opt/homebrew/opt/molten-vk/lib/libMoltenVK.dylib"]
osx_minimum_system_version = "15.0"
